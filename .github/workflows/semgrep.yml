name: Semgrep

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: semgrep-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep
        env:
          BASELINE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          if [ -n "$BASELINE_SHA" ]; then
            semgrep scan --config auto --config .semgrep/ --error --sarif --output semgrep-results.sarif --baseline-commit "$BASELINE_SHA"
          else
            semgrep scan --config auto --config .semgrep/ --error --sarif --output semgrep-results.sarif
          fi

      - name: Print summary
        if: always()
        run: python3 .scripts/summarize_sarif.py semgrep-results.sarif

      - name: Upload results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
        continue-on-error: true

name: Roslyn Built-in Analysis

on: [push, pull_request]

jobs:
  roslyn:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build with analyzers
        run: >
          dotnet build ./eShopOnWeb.sln
          "/p:ErrorLog=${{ github.workspace }}/roslyn-results.sarif%2Cversion=2.1"
          -p:AnalysisLevel=latest
          -p:AnalysisMode=AllEnabledByDefault
          -p:TreatWarningsAsErrors=false

      - name: Print summary
        if: always()
        run: python3 .scripts/summarize_sarif.py roslyn-results.sarif

      - name: Upload results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: roslyn-results.sarif
        continue-on-error: true
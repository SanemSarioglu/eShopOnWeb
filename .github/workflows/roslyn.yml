name: Roslyn Built-in Analysis

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: roslyn-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  roslyn:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Every project in the solution writes its own SARIF file. MSBuild's
      # SARIF logger overwrites rather than appends, so if every project
      # shared one fixed /p:ErrorLog path, only whichever project finished
      # last would survive in the final file -- every earlier project's
      # diagnostics would be silently lost. See Directory.Build.props for
      # how RoslynSarifOutputDir routes each project to its own file.
      - name: Build with analyzers
        run: |
          mkdir -p roslyn-results
          dotnet build ./eShopOnWeb.sln \
            -p:RoslynSarifOutputDir=${{ github.workspace }}/roslyn-results \
            -p:AnalysisLevel=latest \
            -p:AnalysisMode=AllEnabledByDefault \
            -p:TreatWarningsAsErrors=false

      - name: Merge per-project SARIF files
        if: always()
        run: python3 .scripts/merge_sarif.py roslyn-results.sarif roslyn-results/*.sarif

      - name: Print summary
        if: always()
        run: python3 .scripts/summarize_sarif.py roslyn-results.sarif

      - name: Upload results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: roslyn-results.sarif
        continue-on-error: true
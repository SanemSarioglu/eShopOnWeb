Version: 3.1

# Security Code Scan's built-in TaintEntryPoints only recognizes classic
# ASP.NET MVC Controllers as request-handling entry points. This project
# uses the Ardalis.ApiEndpoints / MinimalApi.Endpoint pattern instead --
# a public class ending in "Endpoint" with a public HandleAsync(...) method.
# Without this, SCS silently misses every endpoint in this project, since it
# has no built-in notion of what counts as "untrusted input" here.
TaintEntryPoints:
  System.Object:
    Class:
      Accessibility:
        - public
      Suffix:
        Text: Endpoint
        IncludeParent: true
    Method:
      Name: HandleAsync
      Accessibility:
        - public
      IncludeConstructor: false
      Static: false
